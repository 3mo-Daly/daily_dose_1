<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="120" fill="#FFFBF0"/>
  <!-- Sun rays -->
  <g transform="translate(256,256)" stroke="#10B981" stroke-width="18" stroke-linecap="round">
    <line x1="0" y1="-180" x2="0" y2="-140"/>
    <line x1="127" y1="-127" x2="99" y2="-99"/>
    <line x1="180" y1="0" x2="140" y2="0"/>
    <line x1="127" y1="127" x2="99" y2="99"/>
    <line x1="0" y1="180" x2="0" y2="140"/>
    <line x1="-127" y1="127" x2="-99" y2="99"/>
    <line x1="-180" y1="0" x2="-140" y2="0"/>
    <line x1="-127" y1="-127" x2="-99" y2="-99"/>
  </g>
  <!-- Sun center -->
  <circle cx="256" cy="256" r="120" fill="#10B981"/>
  <!-- Medical cross inside sun -->
  <rect x="236" y="196" width="40" height="120" rx="8" fill="white"/>
  <rect x="196" y="236" width="120" height="40" rx="8" fill="white"/>
