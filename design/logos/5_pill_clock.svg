<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="120" fill="#10B981"/>
  <!-- Clock outer ring -->
  <circle cx="256" cy="256" r="170" fill="white"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#82CBAE" stroke-width="6"/>
  <!-- Hour markers (12, 3, 6, 9) -->
  <circle cx="256" cy="110" r="10" fill="#10B981"/>
  <circle cx="402" cy="256" r="8" fill="#82CBAE"/>
  <circle cx="256" cy="402" r="8" fill="#82CBAE"/>
  <circle cx="110" cy="256" r="8" fill="#82CBAE"/>
  <!-- Pill as clock hand (pointing to ~10 = medication time) -->
  <g transform="translate(256,256) rotate(-60)">
    <rect x="-15" y="-130" width="30" height="130" rx="15" fill="#10B981"/>
    <line x1="-15" y1="-65" x2="15" y2="-65" stroke="white" stroke-width="3"/>
  </g>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#10B981" stroke-width="8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="14" fill="#10B981"/>
</svg>
